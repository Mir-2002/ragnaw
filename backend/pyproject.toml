[project]
name = "ragnaw-backend"
version = "0.1.0"
description = "RAGNaw API: retrieval + tool calling over PokeAPI data"
readme = "README.md"
authors = [
    { name = "Ahmer Macasindel", email = "ahmer@edusuite.asia" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.11",
    "fastapi>=0.115",
    "fastembed>=0.8.1",
    "limits>=5.8.0",
    "numpy>=2.5.3",
    "openai>=3.22.1",
    "pydantic-settings>=2.6",
    "pystemmer>=3.1.0",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ragnaw"

[tool.ruff]
line-length = 100
