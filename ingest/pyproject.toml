[project]
name = "ragnaw-ingest"
version = "0.1.0"
description = "Offline pipeline that turns PokeAPI data into RAGNaw's SQLite DB and search index"
readme = "README.md"
authors = [
    { name = "Ahmer Macasindel", email = "ahmer@edusuite.asia" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.1",
    "httpx>=0.28",
    "numpy>=2.5.3",
    "tokenizers>=0.23.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
ingest = "ingest.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.uv.build-backend]
module-name = "ingest"
